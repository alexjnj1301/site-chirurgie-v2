<header class="site-header">
  <div class="header-container">
    <div class="header-left">
      <a routerLink="/nous-trouver" class="header-icon-link" [title]="'header.findUs' | translate" [attr.aria-label]="'header.findUs' | translate">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </a>
      <a href="tel:0472377390" class="header-icon-link" [title]="'header.call' | translate" [attr.aria-label]="'header.call' | translate">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </a>
    </div>

    <div class="header-center">
      <a routerLink="/" class="brand-logo-link">
        <img src="/themes/asco_theme/images/logo-footer.png" alt="Logo Dr. Papalia" class="brand-emblem">
        <div class="brand-text">
          <span class="brand-title">{{ 'header.doctorTitle' | translate }}</span>
          <span class="brand-subtitle">{{ 'header.doctorSubtitle' | translate }}</span>
        </div>
      </a>
    </div>

    <nav class="header-right">
      <a routerLink="/tarifs" class="nav-item">{{ 'header.tarifs' | translate }}</a>
      <span class="nav-divider">|</span>
      <a routerLink="/contact" class="nav-item">{{ 'header.contact' | translate }}</a>
      <span class="nav-divider">|</span>
      <a routerLink="/prendre-rendez-vous" class="nav-item">{{ 'header.rdv' | translate }}</a>
      <span class="nav-divider">|</span>

      <!-- Language Switcher using Signals -->
      <div class="lang-switcher" role="group" aria-label="Langue / Language">
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang() === 'fr'"
          (click)="switchLang('fr')"
          aria-label="Français">
          FR
        </button>
        <span class="lang-slash">/</span>
        <button
          type="button"
          class="lang-btn"
          [class.active]="currentLang() === 'en'"
          (click)="switchLang('en')"
          aria-label="English">
          EN
        </button>
      </div>
    </nav>
  </div>
</header>
